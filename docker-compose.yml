version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: talent_map_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: talent_map
    volumes:
      - mongodb_data:/data/db
    networks:
      - talent_network

volumes:
  mongodb_data:
    driver: local

networks:
  talent_network:
    driver: bridge
